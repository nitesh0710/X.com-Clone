# Cloudflare Pages project config. `main` → production; other branches → previews.
name = "speed-agency"
compatibility_date = "2026-11-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "speed-agency"
# Replace with the id printed by `wrangler d1 create speed-agency`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Preview deployments use a separate database.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "speed-agency-preview"
# Replace with the id printed by `wrangler d1 create speed-agency-preview`.
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
